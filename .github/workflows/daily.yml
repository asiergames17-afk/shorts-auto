name: Short diario

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC (= 09:00 en Irlanda en invierno, 10:00 en verano)
  workflow_dispatch:       # permite lanzarlo a mano con el botón "Run workflow"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Generar y subir el Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Guardar el vídeo y los textos (para TikTok)
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Guardar el tema usado
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add used_topics.txt
          git diff --cached --quiet || git commit -m "Tema usado"
          git push
